<!DOCTYPE html><html lang="zh-Hant"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>水域生物與海洋保護｜籌碼挑戰</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:"Noto Sans TC","Microsoft JhengHei",sans-serif;background:linear-gradient(135deg,#e7f7f7,#fff8e7);color:#20352b;min-height:100vh}header{display:flex;justify-content:space-between;align-items:center;gap:14px;padding:18px clamp(14px,4vw,46px);background:#ffffffdf;border-bottom:1px solid #d8e8dc;position:sticky;top:0;z-index:2}h1{font-size:clamp(1.05rem,3vw,1.65rem);margin:0;color:#206b72}.scorebox{background:#206b72;color:white;border-radius:15px;padding:10px 15px;font-weight:900;white-space:nowrap;box-shadow:0 4px 0 #174e53}main{width:min(900px,92vw);margin:26px auto 48px}.panel{background:white;border:1px solid #dfeae5;border-radius:24px;padding:clamp(18px,4vw,34px);box-shadow:0 12px 35px #254f3010}.topline{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;color:#587364;font-size:.95rem;font-weight:700}.progress{height:9px;background:#e9eee8;border-radius:99px;margin:14px 0 24px;overflow:hidden}.progress span{display:block;height:100%;background:linear-gradient(90deg,#39a6a2,#a4d86e);width:0;transition:width .25s}h2{font-size:clamp(1.3rem,3.8vw,2rem);line-height:1.55;margin:0 0 22px}.choices{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.answer{padding:16px;border:2px solid #e0e9df;border-radius:15px;background:#fbfdf9;color:#20352b;font-size:1rem;line-height:1.5;text-align:left;cursor:pointer}.answer:hover:not(:disabled){border-color:#70b889;background:#f0fbf3}.answer:disabled{cursor:default}.answer.correct{background:#e4f7e8;border-color:#43a764}.answer.wrong{background:#fff0ee;border-color:#d76b62}.chip-title{margin:26px 0 12px;font-weight:800}.chips{display:flex;gap:12px;flex-wrap:wrap}.chip{flex:1;min-width:90px;border:0;border-radius:16px;padding:14px 10px;background:#fff0bf;color:#684d00;font-weight:900;font-size:1.2rem;cursor:pointer;box-shadow:0 5px 0 #dfb443}.chip.selected{background:#206b72;color:white;box-shadow:0 5px 0 #174e53}.actions{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:22px;flex-wrap:wrap}button.primary,button.secondary{border:0;border-radius:13px;padding:12px 18px;font-weight:800;font-size:1rem;cursor:pointer}.primary{background:#206b72;color:white}.primary:disabled{opacity:.45;cursor:not-allowed}.secondary{background:#edf3ee;color:#315d42}.feedback{min-height:32px;margin-top:18px;font-weight:800;line-height:1.6}.good{color:#247c46}.bad{color:#b33d37}.note{font-size:.88rem;color:#6a7e70;line-height:1.6;margin-top:18px}.screen{display:none;text-align:center;padding:18px 0}.screen.active{display:block}@media(max-width:560px){.choices{grid-template-columns:1fr}header{align-items:flex-start}.scorebox{padding:9px 12px}.panel{border-radius:18px}}
</style></head><body><header><h1>🌊 水域生物與海洋保護｜籌碼挑戰</h1><div class="scorebox">🏆 積分：<span id="score">0</span></div></header><main><section class="panel" id="game"><div class="topline"><span id="sectionLabel"></span><span id="counter"></span></div><div class="progress"><span id="progress"></span></div><h2 id="question"></h2><div class="choices" id="answers"></div><div class="chip-title">先選擇本題要下注的籌碼：</div><div class="chips" id="chips"></div><div class="feedback" id="feedback" aria-live="polite">選好籌碼，再選一個答案。</div><div class="actions"><button class="secondary" id="restart">重新開始</button><button class="primary" id="next" disabled>下一題 →</button></div><p class="note">遊戲規則：先選籌碼再答題；答對加上籌碼分數，答錯扣除所選分數，積分最低為 0。第 1 題為 1、3、5 分，後續題目依序提高。</p></section><section class="panel screen" id="end"><div style="font-size:3rem">🎉</div><h2>挑戰完成！</h2><p id="finalScore" style="font-size:1.4rem;font-weight:900"></p><p id="summary"></p><button class="primary" id="playAgain">再玩一次</button></section></main>
<script>
const questions = [["生物的運動與呼吸", "烏龜在水中與陸地上分別是如何運動的？", "烏龜在水中利用腳游泳，在陸地上用腳爬行。", ["烏龜在水中利用腳游泳，在陸地上用腳爬行。", "烏龜只能在水中游泳。", "烏龜在陸地上用翅膀飛行。", "烏龜靠尾巴跳躍。"]], ["生物的運動與呼吸", "椎實螺主要利用身體的什麼構造進行爬行？", "腹足。", ["腹足。", "魚鰭。", "翅膀。", "呼吸管。"]], ["生物的運動與呼吸", "蝦子在水中有哪些運動方式？", "利用腳行走及游泳。", ["利用腳行走及游泳。", "只能漂浮不能移動。", "用翅膀飛行。", "用腹足滑行。"]], ["生物的運動與呼吸", "蝌蚪在水中是如何前進的？", "利用長長的尾部在水中擺動前進。", ["利用長長的尾部在水中擺動前進。", "利用後腳跳躍。", "用翅膀划水。", "靠腹足爬行。"]], ["生物的運動與呼吸", "蝌蚪長大變成蛙類後，牠們的腳有哪些特徵？", "腳上有蹼，後腳粗壯。", ["腳上有蹼，後腳粗壯。", "四隻腳都沒有關節。", "腳變成魚鰭。", "只剩下前腳。"]], ["生物的運動與呼吸", "蛙類的腳部構造幫助牠們具備哪些運動能力？", "腳上的蹼幫助游泳，粗壯的後腳能在陸地上跳躍。", ["腳上的蹼幫助游泳，粗壯的後腳能在陸地上跳躍。", "腳只用來挖洞。", "前腳能飛行。", "只能在水底爬行。"]], ["生物的運動與呼吸", "紅娘華在水中主要是如何活動的？", "利用腳在水中行走、划動。", ["利用腳在水中行走、划動。", "利用翅膀在水底飛行。", "靠魚鰭游泳。", "用尾巴擺動前進。"]], ["生物的運動與呼吸", "螃蟹可以在哪些場所活動？分別如何運動？", "可在水中用腳游泳，也可以在陸地上行走。", ["可在水中用腳游泳，也可以在陸地上行走。", "只能在樹上跳躍。", "只能在沙地鑽洞。", "只能靠尾巴游泳。"]], ["生物的運動與呼吸", "水黽在水面上是如何運動的？", "利用腳在水面上滑行或行走。", ["利用腳在水面上滑行或行走。", "用鰓在水底爬行。", "用翅膀潛入水底。", "用腹足游泳。"]], ["生物的運動與呼吸", "魚類大多利用身體的什麼構造進行呼吸？", "鰓。", ["鰓。", "肺。", "鼻子。", "腹足。"]], ["生物的運動與呼吸", "魚類呼吸時，水流在魚體內的方向為何？", "水由口進入，經過鰓後，再由鰓蓋後方排出。", ["水由口進入，經過鰓後，再由鰓蓋後方排出。", "水由鰓蓋進入，再從口排出。", "水由尾巴進入。", "水只在嘴巴外流動。"]], ["生物的運動與呼吸", "紅娘華利用什麼構造吸取空氣中的氧氣？位於何處？", "腹部末端的呼吸管，伸出水面呼吸空氣。", ["腹部末端的呼吸管，伸出水面呼吸空氣。", "頭部的魚鰓。", "背部的肺。", "腳上的吸盤。"]], ["生物的運動與呼吸", "蛙類主要利用哪些構造來呼吸？", "肺和濕潤的皮膚。", ["肺和濕潤的皮膚。", "只有鰓。", "只有鼻子。", "腳和尾巴。"]], ["生物的運動與呼吸", "為什麼蛙類的皮膚必須保持濕潤？", "濕潤的皮膚能輔助呼吸；皮膚乾燥會影響氣體交換。", ["濕潤的皮膚能輔助呼吸；皮膚乾燥會影響氣體交換。", "濕潤皮膚可以長出翅膀。", "皮膚濕潤才能製造食物。", "皮膚可代替所有器官。"]], ["生物的運動與呼吸", "紅娘華的主要棲息環境有哪些？", "水中或陸地。", ["水中或陸地。", "只有高山雪地。", "只有沙漠深處。", "只有樹冠上。"]], ["生物的運動與呼吸", "魚類（例如大肚魚）的外表通常有什麼特徵？", "外表濕潤、光滑。", ["外表濕潤、光滑。", "覆蓋羽毛。", "皮膚乾燥且長毛。", "有六隻腳。"]], ["生物的運動與呼吸", "紅娘華在運動時主要靠什麼構造？", "利用腳游泳、行走。", ["利用腳游泳、行走。", "利用魚鰭和尾鰭。", "利用腹足和殼。", "只靠翅膀飛行。"]], ["生物的運動與呼吸", "蛙類在陸地與水中的主要運動方式有何不同？", "陸地上利用腳跳躍，在水中利用腳游泳。", ["陸地上利用腳跳躍，在水中利用腳游泳。", "陸地上游泳，水中飛行。", "陸地上用殼滑行。", "陸地和水中都不能動。"]], ["水域環境與生態保護", "如果沒有良好的水域環境，對水生生物會造成什麼影響？", "水生生物無法健康成長，甚至無法生存。", ["水生生物無法健康成長，甚至無法生存。", "水生生物會變成陸生生物。", "所有水生生物都會長翅膀。", "水質不會影響生物。"]], ["水域環境與生態保護", "鯨鯊為什麼可能誤食海洋中的塑膠袋？", "可能把海裡的塑膠袋誤以為是食物而吞食。", ["可能把海裡的塑膠袋誤以為是食物而吞食。", "塑膠袋提供營養。", "塑膠袋是天然獵物。", "塑膠袋幫助呼吸。"]], ["水域環境與生態保護", "海灘上的垃圾會對海鳥造成什麼危害？", "垃圾可能覆蓋海灘，使鳥類難以尋找食物。", ["垃圾可能覆蓋海灘，使鳥類難以尋找食物。", "垃圾讓海鳥更容易築巢。", "垃圾增加天然食物。", "垃圾不會影響海鳥。"]], ["水域環境與生態保護", "工廠未經處理就排放廢水，可能造成什麼後果？", "污染水質，導致水生生物生病或死亡。", ["污染水質，導致水生生物生病或死亡。", "讓河水變成飲用水。", "增加水中氧氣。", "不影響環境。"]], ["水域環境與生態保護", "海洋發生油污事件時，常用哪些工具清除油污並防止擴散？", "攔油索和吸油索。", ["攔油索和吸油索。", "捕魚網和魚簍。", "雨傘和水桶。", "木板和紙箱。"]], ["水域環境與生態保護", "海洋油污清理後，為什麼仍可能持續影響海洋生態？", "仍可能有少量有害物質殘留在海洋環境中。", ["仍可能有少量有害物質殘留在海洋環境中。", "油污讓所有生物更健康。", "海水把污染物變成氧氣。", "清理後絕不會再有影響。"]], ["水域環境與生態保護", "小學生可以做哪些事來保護水域環境？", "不亂丟垃圾、不任意放生或棄養、參與淨灘淨溪、支持污水妥善處理等。", ["不亂丟垃圾、不任意放生或棄養、參與淨灘淨溪、支持污水妥善處理等。", "把垃圾丟進河裡。", "把寵物放生到溪流。", "把油倒入水溝。"]], ["塑膠微粒與海洋", "海洋中的塑膠微粒是如何形成的？", "塑膠製品進入海洋後，經波浪衝擊與陽光紫外線照射，逐漸破碎成更小的顆粒。", ["塑膠製品進入海洋後，經波浪衝擊與陽光紫外線照射，逐漸破碎成更小的顆粒。", "海水中的鹽變成塑膠。", "魚類自然生長出塑膠。", "海藻把沙子變成塑膠。"]], ["塑膠微粒與海洋", "人類食用哪些海鮮時，較可能接觸到塑膠微粒？", "貽貝、牡蠣等濾食性海洋生物。", ["貽貝、牡蠣等濾食性海洋生物。", "只有海帶和紫菜。", "只有大型海藻。", "海鮮完全不會接觸塑膠微粒。"]], ["塑膠微粒與海洋", "製造塑膠時添加的某些化學物質，可能干擾人體哪些系統？", "神經系統發展以及內分泌系統。", ["神經系統發展以及內分泌系統。", "只有骨骼外觀。", "只有頭髮顏色。", "只有指甲長度。"]], ["塑膠微粒與海洋", "聯合國將每年的哪一天訂為世界海洋日？", "每年的 6 月 8 日。", ["每年的 6 月 8 日。", "每年的 1 月 1 日。", "每年的 4 月 22 日。", "每年的 12 月 31 日。"]], ["塑膠微粒與海洋", "為了減少塑膠微粒的產生與接觸，消費時可以怎麼做？", "減少使用一次性塑膠包裝，支持超市減塑等環保行動。", ["減少使用一次性塑膠包裝，支持超市減塑等環保行動。", "每次購物多包幾層塑膠。", "把塑膠垃圾丟進河川。", "所有用品只用一次就丟掉。"]]];
let index=0,score=0,correctCount=0,selectedChip=null,answered=false;
const $=id=>document.getElementById(id);
function chipValues(i){if(i===0)return [1,3,5];const base=5+i*5;return [base,base+5,base+10]}
function shuffle(a){return a.map(v=>[Math.random(),v]).sort((x,y)=>x[0]-y[0]).map(x=>x[1])}
function render(){if(index>=questions.length){finish();return}const q=questions[index];selectedChip=null;answered=false;$("sectionLabel").textContent=q[0];$("counter").textContent=`第 ${index+1} / ${questions.length} 題`;$("progress").style.width=`${index/questions.length*100}%`;$("question").textContent=q[1];$("feedback").textContent="選好籌碼，再選一個答案。";$("feedback").className="feedback";$("next").disabled=true;$("next").textContent=index===questions.length-1?"查看結果 →":"下一題 →";$("answers").innerHTML="";$("chips").innerHTML="";shuffle(q[3]).forEach(opt=>{let b=document.createElement("button");b.className="answer";b.textContent=opt;b.onclick=()=>answer(opt,b);$("answers").appendChild(b)});chipValues(index).forEach(n=>{let b=document.createElement("button");b.className="chip";b.textContent=n+" 分";b.onclick=()=>{if(answered)return;selectedChip=n;document.querySelectorAll(".chip").forEach(x=>x.classList.remove("selected"));b.classList.add("selected");$("feedback").textContent=`已選擇 ${n} 分，請作答。`};$("chips").appendChild(b)});$("score").textContent=score}
function answer(opt,button){if(answered)return;if(selectedChip===null){$("feedback").textContent="請先選擇一個籌碼，再回答題目。";$("feedback").className="feedback bad";return}answered=true;const q=questions[index],good=opt===q[2];document.querySelectorAll(".answer").forEach(b=>{b.disabled=true;if(b.textContent===q[2])b.classList.add("correct")});if(good){score+=selectedChip;correctCount++;$("feedback").textContent=`答對了！ +${selectedChip} 分。正確答案：${q[2]}`;$("feedback").className="feedback good";button.classList.add("correct")}else{score=Math.max(0,score-selectedChip);button.classList.add("wrong");$("feedback").textContent=`答錯了！ -${selectedChip} 分。正確答案：${q[2]}`;$("feedback").className="feedback bad"}$("score").textContent=score;$("next").disabled=false}
function finish(){$("game").style.display="none";$("end").classList.add("active");$("finalScore").textContent=`你的最終積分：${score} 分`;$("summary").textContent=`共答對 ${correctCount} / ${questions.length} 題。`}
function restart(){$("end").classList.remove("active");$("game").style.display="block";index=0;score=0;correctCount=0;render()}
$("next").onclick=()=>{if(answered){index++;render()}};$("restart").onclick=restart;$("playAgain").onclick=restart;render();
</script></body></html>
